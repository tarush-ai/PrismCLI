[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismlabs"
version = "0.1.0"
description = "Scientific research CLI — from observation to publication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "openai>=1.30",
    "arxiv>=2.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
prism = "prism.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]
